<script>
  (function() {
    // Получаем элементы кнопки и текста внутри неё
    const btn = document.getElementById('downloadBtn');
    const btnTextSpan = document.getElementById('btnText');
    
    // Ссылка на реальный файл лежит в data-атрибуте
    const realLink = btn.getAttribute('data-real-link');
    
    // Флаг, чтобы таймер запускался только один раз
    let timerActive = false;
    let countdown = 10;
    let intervalId = null;

    // Функция запуска отсчёта
    function startCountdown(event) {
      if (timerActive) return;        // уже идёт таймер
      if (countdown !== 10) return;   // вдруг уже отсчитали
      
      // Отменяем стандартное поведение (переход по #)
      event.preventDefault();
      
      timerActive = true;
      btn.classList.add('disabled');   // делаем кнопку серой / неактивной
      
      // Меняем текст на обратный отсчёт
      function updateTimerDisplay() {
        if (btnTextSpan) {
          btnTextSpan.innerText = `Подождите ${countdown} сек...`;
        }
      }
      
      updateTimerDisplay();
      
      intervalId = setInterval(function() {
        countdown--;
        if (countdown >= 0) {
          updateTimerDisplay();
        }
        
        if (countdown < 0) {
          // Таймер закончился: очищаем интервал, убираем disabled, возвращаем текст
          clearInterval(intervalId);
          intervalId = null;
          
          // Возвращаем кнопке исходный вид
          btn.classList.remove('disabled');
          if (btnTextSpan) {
            btnTextSpan.innerText = 'Скачать VPN';
          }
          
          // Теперь разрешаем переход по ссылке (перенаправляем на реальный файл)
          window.location.href = realLink;
          
          // Сбрасываем флаги на случай повторных нажатий (но ссылка уже открыта)
          timerActive = false;
          countdown = 10;
        }
      }, 1000); // каждую секунду
    }
    
    // Вешаем обработчик на кнопку
    if (btn) {
      btn.addEventListener('click', startCountdown);
    }
  })();
</script>
