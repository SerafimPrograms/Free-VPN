<!DOCTYPE html>

    * {

    body {

      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;

    /* ГЛАВНЫЙ КОНТЕЙНЕР - ЦЕНТРИРУЕТ ВСЁ И НЕ ДАЁТ СЪЕЗЖАТЬ */
    .page-container {

      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Общий контейнер для любого баннера */
    .banner-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* Слот для кастомного тега mbvn-bnnr либо iframe */
    .banner-slot {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 270px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }

    /* ГАРАНТИРУЕМ, ЧТО ЛЮБОЙ КОНТЕНТ ВНУТРИ СЛОТА — ПО ЦЕНТРУ */
    .banner-slot > *,
    .banner-slot mbvn-bnnr,
    .banner-slot iframe,
    .banner-slot ins,

      margin: 0 auto !important;
      display: block !important;
      text-align: center !important;
    }

    /* КАРТОЧКА - идеальное центрирование без смещений */
    .card {

      background: rgba(18, 25, 40, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 2rem;
      border: 1px solid rgba(72, 187, 255, 0.25);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 255, 255, 0.08);
      padding: 2rem 1.8rem 2.2rem;
      text-align: center;
      transition: all 0.2s;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      background: linear-gradient(120deg, #c0e0ff, #4a9eff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.2px;
    }

    .sub {
      font-size: 0.9rem;
      color: #8fafcf;
      margin-bottom: 1.8rem;
      border-bottom: 1px dashed #2a3850;
      display: inline-block;
      padding-bottom: 0.3rem;
    }

    .shield {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 0.5rem 0 1.2rem;
      color: #3d7eb3;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }

    .shield span {
      background: #101826;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      font-weight: 500;
      border: 0.5px solid #2a3c5a;
      backdrop-filter: blur(2px);
    }

    .desc {
      color: #bdd4f0;
      margin: 1.2rem 0 1rem;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(95deg, #0f5fcf, #0a3a7a);
      padding: 1rem 2rem;
      width: 100%;
      border-radius: 60px;
      font-size: 1.4rem;
      font-weight: bold;
      color: white;
      text-decoration: none;
      transition: 0.2s;
      box-shadow: 0 8px 18px rgba(0, 20, 50, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
      margin: 0.75rem 0 0.5rem;
    }

    .btn-download:hover {
      background: linear-gradient(95deg, #1970e0, #0a428a);
      transform: scale(1.01);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.5);
    }

    .btn-icon {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2));
    }

    .warning {
      background: #0c1422b3;
      border-radius: 20px;
      padding: 0.6rem;
      font-size: 0.7rem;
      color: #8da3c9;
      margin-top: 1rem;
      border: 0.5px solid #2a3c5a;
    }

    .footer-note {
      font-size: 0.7rem;
      color: #5e7492;
      margin-top: 1.8rem;
      border-top: 1px solid #1e2a3e;
      padding-top: 1.3rem;
    }

    /* Мобильная адаптация - ничего не сжимаем к правому краю */
    @media (max-width: 550px) {
      body {
        padding: 1rem;
      }
      .page-container {

        gap: 1.2rem;
      }
      .card {

      }
      h1 {

      }
      .btn-download {

        padding: 0.75rem 1rem;
      }
      .banner-slot {
        min-height: 250px;
      }
      .shield span {

      }
    }

    /* Доп. фикс для старых баннеров, если они inline-block */
    .banner-wrapper mbvn-bnnr {
      display: block;
      text-align: center;
    }
  </style>
</head>
